<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kenyan Product Recommender - Association Rules</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 700px;
        }
        h2 { color: #2196F3; }
        .quick-add {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .quick-add button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .quick-add button:hover {
            background-color: #45a049;
        }
        button {
            padding: 10px 15px;
            background-color: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
        }
        .tag {
            display: inline-block;
            background-color: #e0e0e0;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
        }
        #cartItems, #recommendations {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        .recommendation {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h2>Product Recommender</h2>
<p>Add food items to your cart and get personalized recommendations using Machine Learning!</p>

<h3>Quick Add Popular Items:</h3>
<div class="quick-add">
    <button onclick="quickAdd('beans')">Beans</button>
    <button onclick="quickAdd('kienyeji chicken')">Kienyeji Chicken</button>
    <button onclick="quickAdd('sukuma wiki')">Sukuma Wiki</button>
    <button onclick="quickAdd('matoke')">Matoke</button>
    <button onclick="quickAdd('maziwa mala')">Maziwa Mala</button>
    <button onclick="quickAdd('mango')">Mango</button>
    <button onclick="quickAdd('ndizi')">Ndizi</button>
    <button onclick="quickAdd('ugali')">Ugali</button>
    <button onclick="quickAdd('nyama choma')">Nyama Choma</button>
</div>

<div style="margin: 20px 0;">
    <button onclick="getRecommendations()" style="background-color: #FF9800; font-size: 16px;"> Get Recommendations</button>
    <button onclick="clearCart()" style="background-color: #f44336;">🗑️ Clear Cart</button>
</div>

<div id="cartItems">
    <h3>🛒 Your Cart:</h3>
    <div id="cartList">Empty - Click items above to add</div>
</div>

<div id="recommendations" style="display:none;">
    <h3> Recommended Products:</h3>
    <div id="recommendList"></div>
</div>

<script>
    let cart = [];

    function quickAdd(item) {
        if (!cart.includes(item)) {
            cart.push(item);
            updateCartDisplay();
        }
    }

    function clearCart() {
        cart = [];
        updateCartDisplay();
        document.getElementById('recommendations').style.display = 'none';
    }

    function updateCartDisplay() {
        const cartList = document.getElementById('cartList');
        if (cart.length === 0) {
            cartList.innerHTML = 'Empty - Click items above to add';
        } else {
            cartList.innerHTML = cart.map(item => 
                `<span class="tag">${item} <button onclick="removeItem('${item}')" style="background:none;border:none;color:red;cursor:pointer;font-size:16px;">✕</button></span>`
            ).join('');
        }
    }

    function removeItem(item) {
        cart = cart.filter(i => i !== item);
        updateCartDisplay();
    }

    async function getRecommendations() {
        if (cart.length === 0) {
            alert('Please add at least one item to your cart!');
            return;
        }

        const data = { cart: cart };

        try {
            const response = await fetch('https://refactored-carnival-56jrvpj6q96fpxq9-5000.app.github.dev/api/v1/models/recommender/predictions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            const recommendDiv = document.getElementById('recommendations');
            const recommendList = document.getElementById('recommendList');
            
            if (result.recommendations && result.recommendations.length > 0) {
                recommendList.innerHTML = result.recommendations.map((item, i) => 
                    `<div class="recommendation">${i+1}. ${item}</div>`
                ).join('');
                recommendDiv.style.display = 'block';
            } else {
                recommendList.innerHTML = '<p>No recommendations available for these items.</p>';
                recommendDiv.style.display = 'block';
            }

        } catch (error) {
            console.error('Error:', error);
            alert('Error getting recommendations! Make sure Flask is running.');
        }
    }
</script>

</body>
</html>
